name: Deploy The Mumfali Story

on:
  push:
    branches: [ main, master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Aanu-birthday-surprise/surprise-site
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: ./Aanu-birthday-surprise/surprise-site/dist
          token: ${{ secrets.GITHUB_TOKEN }}
