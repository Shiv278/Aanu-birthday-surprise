name: Build and deploy surprise site

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci
        working-directory: ./Aanu-birthday-surprise/surprise-site

      - name: Build site
        run: npm run build
        working-directory: ./Aanu-birthday-surprise/surprise-site

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: ./Aanu-birthday-surprise/surprise-site/dist
          token: ${{ secrets.GITHUB_TOKEN }}
